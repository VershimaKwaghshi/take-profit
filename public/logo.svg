<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">

  <!-- Background -->
  <rect width="800" height="800" fill="#FFFFFF" />

  <!-- Take Profit Logo Core -->
  <g id="Take-Profit-Logo-Core">

    <!-- Foundation -->
    <polygon
      points="400,502 330,610 470,610"
      fill="#000000"
      stroke="#000000"
      stroke-width="24"
      stroke-linejoin="round"
    />

    <!-- Balance Beam -->
    <g transform="rotate(-12, 400, 486)">

      <rect
        x="80"
        y="470"
        width="640"
        height="32"
        rx="16"
        ry="16"
        fill="#000000"
      />

      <!-- Trader Sphere (Red) -->
      <circle
        cx="125"
        cy="446"
        r="24"
        fill="#E1061B"
      />

      <!-- Market Sphere (Blue) -->
      <circle
        cx="600"
        cy="371"
        r="95"
        fill="#0066FF"
      />

    </g>

  </g>

</svg>