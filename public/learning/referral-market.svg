<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .line-stroke { stroke: #D9DEE8; stroke-width: 2; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="60" class="title">THE REFERRAL MARKET STRUCTURE</text>

  <!-- Horizontal Connecting Lines -->
  <line x1="160" y1="240" x2="270" y2="240" class="line-stroke" />
  <line x1="330" y1="240" x2="440" y2="240" class="line-stroke" />
  <line x1="500" y1="240" x2="610" y2="240" class="line-stroke" />

  <!-- Step 1: Introducer / Referral -->
  <g transform="translate(130, 240)">
    <text x="0" y="-56" class="step-num">STAGE 01</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- User Plus Icon -->
    <circle cx="-4" cy="-6" r="5" class="icon-fill" />
    <path d="M -12 10 C -12 3, -8 1, -4 1 C 0 1, 4 3, 4 10 Z" class="icon-fill" />
    <path d="M 6 -4 L 14 -4 M 10 -8 L 10 0" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="52" class="label">INVITATION</text>
    <text x="0" y="68" class="subtext">Network Growth</text>
  </g>

  <!-- Step 2: Onboarding & Participation -->
  <g transform="translate(300, 240)">
    <text x="0" y="-56" class="step-num">STAGE 02</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Connected Users Icon -->
    <circle cx="-8" cy="-4" r="4" class="icon-fill" />
    <circle cx="8" cy="-4" r="4" class="icon-fill" />
    <path d="M -8 10 C -8 4, 8 4, 8 10 Z" class="icon-fill" />
    <text x="0" y="52" class="label">PARTICIPATION</text>
    <text x="0" y="68" class="subtext">Active Engagement</text>
  </g>

  <!-- Step 3: Ecosystem Activity -->
  <g transform="translate(470, 240)">
    <text x="0" y="-56" class="step-num">STAGE 03</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Activity Node / Mesh Icon -->
    <circle cx="0" cy="0" r="6" stroke="#071A52" stroke-width="2" fill="none" />
    <circle cx="-12" cy="-8" r="3" class="icon-fill" />
    <circle cx="12" cy="-8" r="3" class="icon-fill" />
    <circle cx="0" cy="12" r="3" class="icon-fill" />
    <path d="M -10 -6 L -4 -2 M 10 -6 L 4 -2 M 0 10 L 0 4" stroke="#071A52" stroke-width="1.5" />
    <text x="0" y="52" class="label">VOLUME &amp; SKILL</text>
    <text x="0" y="68" class="subtext">Platform Utility</text>
  </g>

  <!-- Step 4: Value Sharing -->
  <g transform="translate(640, 240)">
    <text x="0" y="-56" class="step-num">STAGE 04</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Reward / Handshake Icon -->
    <path d="M -10 -2 L -4 -8 L 0 -4 L 6 -8 L 10 -4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M -10 4 L -4 8 L 4 8 L 10 4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="52" class="label">MUTUAL VALUE</text>
    <text x="0" y="68" class="subtext">Aligned Incentives</text>
  </g>

  <!-- Footer Explanation -->
  <text x="400" y="420" class="subtext">The referral market creates a structured model where introducing participants supports community growth</text>
  <text x="400" y="438" class="subtext">and generates aligned value as members participate across the ecosystem.</text>
</svg>
