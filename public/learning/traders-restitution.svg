<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .section-label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .node-label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #071A52; letter-spacing: 0.02em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .line-stroke { stroke: #D9DEE8; stroke-width: 2; }
      .divider-stroke { stroke: #D9DEE8; stroke-width: 1.5; stroke-dasharray: 4 4; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="50" class="title">TRADER CAPITAL ALIGNMENT &amp; RESTITUTION</text>

  <!-- Vertical Divider Line -->
  <line x1="400" y1="80" x2="400" y2="390" class="divider-stroke" />

  <!-- LEFT COLUMN: TRADITIONAL PATH -->
  <text x="200" y="95" class="section-label">TRADITIONAL PATH</text>
  
  <!-- Left Side Connecting Line -->
  <line x1="200" y1="130" x2="200" y2="330" class="line-stroke" />

  <!-- Step 1: Entry / Fee -->
  <g transform="translate(200, 140)">
    <circle cx="0" cy="0" r="28" class="node-stroke" />
    <text x="0" y="-4" class="node-label">EVAL / FEE</text>
    <text x="0" y="10" class="subtext">Upfront Cost</text>
  </g>

  <!-- Step 2: Loss / Failure -->
  <g transform="translate(200, 230)">
    <circle cx="0" cy="0" r="28" class="node-stroke" />
    <!-- X Mark / Loss Icon -->
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="-65" y="4" class="node-label">ACCOUNT LOSS</text>
  </g>

  <!-- Step 3: Full Reset -->
  <g transform="translate(200, 320)">
    <circle cx="0" cy="0" r="28" class="node-stroke" />
    <!-- Reset Loop Arrow Icon -->
    <path d="M -8 -4 A 10 10 0 1 1 -2 10 M -8 -10 L -8 -4 L -2 -4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="48" class="node-label">START AGAIN</text>
    <text x="0" y="64" class="subtext">Lost Capital &amp; Time</text>
  </g>

  <!-- RIGHT COLUMN: TAKE PROFIT APPROACH -->
  <text x="600" y="95" class="section-label">TAKE PROFIT APPROACH</text>

  <!-- Right Side Connecting Line -->
  <line x1="600" y1="130" x2="600" y2="330" class="line-stroke" />

  <!-- Step 1: Participation -->
  <g transform="translate(600, 140)">
    <circle cx="0" cy="0" r="28" class="node-stroke" />
    <!-- User / Participation Icon -->
    <circle cx="0" cy="-6" r="6" class="icon-fill" />
    <path d="M -10 10 C -10 2, -5 0, 0 0 C 5 0, 10 2, 10 10 Z" class="icon-fill" />
    <text x="0" y="48" class="node-label">PARTICIPATION</text>
    <text x="0" y="64" class="subtext">Active Trading Journey</text>
  </g>

  <!-- Step 2: Performance History -->
  <g transform="translate(600, 230)">
    <circle cx="0" cy="0" r="28" class="node-stroke" />
    <!-- Ledger / Track Record Icon -->
    <path d="M -10 -10 L 10 -10 L 10 10 L -10 10 Z M -6 -4 L 6 -4 M -6 0 L 2 0 M -6 4 L 4 4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="80" y="4" class="node-label">RECORD &amp; HISTORY</text>
  </g>

  <!-- Step 3: Restitution & Continuity -->
  <g transform="translate(600, 320)">
    <rect x="-60" y="-20" width="120" height="40" rx="16" class="node-stroke" />
    <!-- Shield / Shielded Opportunity Icon -->
    <path d="M 0 -10 L 8 -6 L 8 2 C 8 7 0 10 0 10 C 0 10 -8 7 -8 2 L -8 -6 Z" fill="none" stroke="#071A52" stroke-width="2" />
    <text x="0" y="48" class="node-label">RESTITUTION</text>
    <text x="0" y="64" class="subtext">Continued Opportunity</text>
  </g>

  <!-- Footer Explanation -->
  <text x="400" y="440" class="subtext">Rather than treating losses as dead ends that force repeated evaluation cycles,</text>
  <text x="400" y="458" class="subtext">the restitution mechanism aligns capital with performance history for sustained participation.</text>
</svg>
