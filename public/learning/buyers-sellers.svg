<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .price-text { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 700; fill: #071A52; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .line-stroke { stroke: #D9DEE8; stroke-width: 2; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="60" class="title">EVERY TRADE HAS TWO SIDES</text>

  <!-- Connecting Lines -->
  <line x1="220" y1="240" x2="330" y2="240" class="line-stroke" />
  <line x1="470" y1="240" x2="580" y2="240" class="line-stroke" />

  <!-- Left Node: Buyers (Ask Side) -->
  <g transform="translate(160, 240)">
    <circle cx="0" cy="0" r="42" class="node-stroke" />
    <!-- Upward Arrow Icon -->
    <path d="M 0 16 L 0 -12 M -10 -2 L 0 -12 L 10 -2" fill="none" stroke="#071A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="64" class="label">BUYERS</text>
    <text x="0" y="82" class="subtext">Willing to Bid</text>
  </g>

  <!-- Center Hub: Price Match / Order Execution -->
  <g transform="translate(400, 240)">
    <rect x="-70" y="-45" width="140" height="90" rx="16" class="node-stroke" />
    <!-- Handshake / Equilibrium Icon -->
    <path d="M -16 -12 L 16 -12 M -8 -4 L 8 -4" fill="none" stroke="#071A52" stroke-width="2.5" stroke-linecap="round" />
    <text x="0" y="16" class="price-text">MATCHED PRICE</text>
    <text x="0" y="64" class="label">EXECUTION</text>
    <text x="0" y="82" class="subtext">Equilibrium Reached</text>
  </g>

  <!-- Right Node: Sellers (Bid Side) -->
  <g transform="translate(640, 240)">
    <circle cx="0" cy="0" r="42" class="node-stroke" />
    <!-- Downward Arrow Icon -->
    <path d="M 0 -12 L 0 16 M -10 6 L 0 16 L 10 6" fill="none" stroke="#071A52" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="64" class="label">SELLERS</text>
    <text x="0" y="82" class="subtext">Willing to Ask</text>
  </g>

  <!-- Footer Explanation -->
  <text x="400" y="420" class="subtext">You cannot buy unless someone sells, and you cannot sell unless someone buys.</text>
  <text x="400" y="438" class="subtext">The market simply connects both parties at an agreed price.</text>
</svg>
