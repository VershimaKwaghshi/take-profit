<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .line-stroke { stroke: #D9DEE8; stroke-width: 2; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="60" class="title">CONNECTING FUNDED TRADERS TO CAPITAL</text>

  <!-- Horizontal Connecting Lines -->
  <line x1="120" y1="240" x2="210" y2="240" class="line-stroke" />
  <line x1="270" y1="240" x2="360" y2="240" class="line-stroke" />
  <line x1="420" y1="240" x2="510" y2="240" class="line-stroke" />
  <line x1="570" y1="240" x2="660" y2="240" class="line-stroke" />

  <!-- Step 1: Funded Trader -->
  <g transform="translate(90, 240)">
    <text x="0" y="-56" class="step-num">STAGE 01</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Trader Badge Icon -->
    <circle cx="0" cy="-6" r="6" class="icon-fill" />
    <path d="M -10 10 C -10 2, -5 0, 0 0 C 5 0, 10 2, 10 10 Z" class="icon-fill" />
    <text x="0" y="52" class="label">FUNDED TRADER</text>
    <text x="0" y="68" class="subtext">Verified Level</text>
  </g>

  <!-- Step 2: Verified Track Record -->
  <g transform="translate(240, 240)">
    <text x="0" y="-56" class="step-num">STAGE 02</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Checkmark / Verified Data Icon -->
    <path d="M -8 0 L -2 6 L 8 -4" fill="none" stroke="#071A52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="0" cy="0" r="14" fill="none" stroke="#071A52" stroke-width="2" />
    <text x="0" y="52" class="label">VERIFIED RECORD</text>
    <text x="0" y="68" class="subtext">Audited Metrics</text>
  </g>

  <!-- Step 3: Manager Market Hub -->
  <g transform="translate(390, 240)">
    <text x="0" y="-56" class="step-num">STAGE 03</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Exchange / Marketplace Hub Icon -->
    <rect x="-10" y="-10" width="20" height="20" rx="4" fill="none" stroke="#071A52" stroke-width="2" />
    <circle cx="0" cy="0" r="4" class="icon-fill" />
    <text x="0" y="52" class="label">MANAGER MARKET</text>
    <text x="0" y="68" class="subtext">Matching Layer</text>
  </g>

  <!-- Step 4: Capital Managers -->
  <g transform="translate(540, 240)">
    <text x="0" y="-56" class="step-num">STAGE 04</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Capital Manager / Portfolio Icon -->
    <path d="M -10 -6 L 10 -6 L 10 8 L -10 8 Z M -4 -6 L -4 -10 L 4 -10 L 4 -6" fill="none" stroke="#071A52" stroke-width="2" stroke-linejoin="round" />
    <text x="0" y="52" class="label">CAPITAL MANAGERS</text>
    <text x="0" y="68" class="subtext">Portfolio Allocation</text>
  </g>

  <!-- Step 5: Capital Scale -->
  <g transform="translate(690, 240)">
    <text x="0" y="-56" class="step-num">STAGE 05</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Growth / Scale Arrow Icon -->
    <path d="M -8 8 L 8 -8 M 0 -8 L 8 -8 L 8 0" fill="none" stroke="#071A52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="52" class="label">CAPITAL SCALE</text>
    <text x="0" y="68" class="subtext">Expanded Growth</text>
  </g>

  <!-- Footer Explanation -->
  <text x="400" y="420" class="subtext">After achieving funded status, verified trading data allows traders to enter the Manager Market.</text>
  <text x="400" y="438" class="subtext">This connects proven traders directly with capital managers for larger allocation opportunities.</text>
</svg>
