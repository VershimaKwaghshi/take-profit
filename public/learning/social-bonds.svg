<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .connection-line { stroke: #071A52; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .solid-line { stroke: #071A52; stroke-width: 2; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="55" class="title">COMMUNITY TRUST &amp; SOCIAL BONDS</text>

  <!-- Central Interconnected Bond Network -->
  <!-- Outer Connection Web -->
  <line x1="250" y1="180" x2="400" y2="130" class="connection-line" />
  <line x1="550" y1="180" x2="400" y2="130" class="connection-line" />
  <line x1="250" y1="180" x2="300" y2="300" class="connection-line" />
  <line x1="550" y1="180" x2="500" y2="300" class="connection-line" />
  <line x1="300" y1="300" x2="500" y2="300" class="connection-line" />

  <!-- Central Strong Bond Core -->
  <line x1="400" y1="130" x2="400" y2="230" class="solid-line" />
  <line x1="250" y1="180" x2="400" y2="230" class="solid-line" />
  <line x1="550" y1="180" x2="400" y2="230" class="solid-line" />
  <line x1="300" y1="300" x2="400" y2="230" class="solid-line" />
  <line x1="500" y1="300" x2="400" y2="230" class="solid-line" />

  <!-- Node 1: Top (Shared Standards) -->
  <g transform="translate(400, 130)">
    <circle cx="0" cy="0" r="24" class="node-stroke" />
    <path d="M -6 0 L -2 4 L 6 -4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="-32" class="label">TRANSPARENCY</text>
  </g>

  <!-- Node 2: Left (Trader A) -->
  <g transform="translate(250, 180)">
    <circle cx="0" cy="0" r="24" class="node-stroke" />
    <circle cx="0" cy="-4" r="4" class="icon-fill" />
    <path d="M -6 8 C -6 3, 6 3, 6 8 Z" class="icon-fill" />
    <text x="-45" y="4" class="label">TRADER</text>
  </g>

  <!-- Node 3: Right (Trader B) -->
  <g transform="translate(550, 180)">
    <circle cx="0" cy="0" r="24" class="node-stroke" />
    <circle cx="0" cy="-4" r="4" class="icon-fill" />
    <path d="M -6 8 C -6 3, 6 3, 6 8 Z" class="icon-fill" />
    <text x="45" y="4" class="label">PEER</text>
  </g>

  <!-- Node 4: Bottom Left (Accountability) -->
  <g transform="translate(300, 300)">
    <circle cx="0" cy="0" r="24" class="node-stroke" />
    <!-- Shield Icon -->
    <path d="M 0 -7 L 6 -4 L 6 2 C 6 5 0 7 0 7 C 0 7 -6 5 -6 2 L -6 -4 Z" fill="none" stroke="#071A52" stroke-width="1.8" />
    <text x="0" y="40" class="label">ACCOUNTABILITY</text>
  </g>

  <!-- Node 5: Bottom Right (Shared Progress) -->
  <g transform="translate(500, 300)">
    <circle cx="0" cy="0" r="24" class="node-stroke" />
    <!-- Growth Node Icon -->
    <path d="M -6 4 L 0 -4 L 6 4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="40" class="label">ALIGNMENT</text>
  </g>

  <!-- Center Hub: Social Bond Anchor -->
  <g transform="translate(400, 230)">
    <circle cx="0" cy="0" r="28" fill="#071A52" stroke="#071A52" stroke-width="2" />
    <!-- Lock / Bond Anchor Icon -->
    <path d="M -6 2 L -6 -2 C -6 -5 -3 -7 0 -7 C 3 -7 6 -5 6 -2 L 6 2 M -8 2 L 8 2 L 8 8 L -8 8 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" />
  </g>

  <!-- Footer Explanation -->
  <text x="400" y="420" class="subtext">Social bonds transform isolated trading activity into a peer-verified community ecosystem.</text>
  <text x="400" y="438" class="subtext">Transparent metrics and shared standards build long-term trust and collective resilience.</text>
</svg>
