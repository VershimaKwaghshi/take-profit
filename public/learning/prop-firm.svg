<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 11px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .step-num { font-family: system-ui, -apple-system, sans-serif; font-size: 10px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .line-stroke { stroke: #D9DEE8; stroke-width: 2; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="60" class="title">SOLVING THE CAPITAL BARRIER: THE PROP FIRM MODEL</text>

  <!-- Horizontal Connecting Lines -->
  <line x1="120" y1="240" x2="210" y2="240" class="line-stroke" />
  <line x1="270" y1="240" x2="360" y2="240" class="line-stroke" />
  <line x1="420" y1="240" x2="510" y2="240" class="line-stroke" />
  <line x1="570" y1="240" x2="660" y2="240" class="line-stroke" />

  <!-- Step 1: Individual Trader -->
  <g transform="translate(90, 240)">
    <text x="0" y="-56" class="step-num">STEP 01</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <circle cx="0" cy="-8" r="8" class="icon-fill" />
    <path d="M -12 12 C -12 2, -6 0, 0 0 C 6 0, 12 2, 12 12 Z" class="icon-fill" />
    <text x="0" y="52" class="label">TRADER</text>
    <text x="0" y="68" class="subtext">Limited Capital</text>
  </g>

  <!-- Step 2: Evaluation / Challenge -->
  <g transform="translate(240, 240)">
    <text x="0" y="-56" class="step-num">STEP 02</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Target / Checklist Icon -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#071A52" stroke-width="2" />
    <path d="M -6 0 L -2 4 L 6 -4" fill="none" stroke="#071A52" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="52" class="label">EVALUATION</text>
    <text x="0" y="68" class="subtext">Challenge Rules</text>
  </g>

  <!-- Step 3: Funded Account -->
  <g transform="translate(390, 240)">
    <text x="0" y="-56" class="step-num">STEP 03</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Key / Unlocked Vault Icon -->
    <circle cx="-4" cy="-4" r="7" fill="none" stroke="#071A52" stroke-width="2" />
    <path d="M 1 -1 L 11 9 M 7 5 L 10 5 M 9 7 L 11 7" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="52" class="label">FUNDED ACCOUNT</text>
    <text x="0" y="68" class="subtext">Access Granted</text>
  </g>

  <!-- Step 4: Trading Capital -->
  <g transform="translate(540, 240)">
    <text x="0" y="-56" class="step-num">STEP 04</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Institutional Capital Stack Icon -->
    <rect x="-12" y="-10" width="24" height="6" rx="2" class="icon-fill" />
    <rect x="-12" y="-2" width="24" height="6" rx="2" class="icon-fill" />
    <rect x="-12" y="6" width="24" height="6" rx="2" class="icon-fill" />
    <text x="0" y="52" class="label">TRADING CAPITAL</text>
    <text x="0" y="68" class="subtext">Scaled Liquidity</text>
  </g>

  <!-- Step 5: Profit Split -->
  <g transform="translate(690, 240)">
    <text x="0" y="-56" class="step-num">STEP 05</text>
    <circle cx="0" cy="0" r="32" class="node-stroke" />
    <!-- Split Arrows / Shared Value Icon -->
    <path d="M -8 -8 L 8 8 M 8 -8 L -8 8" stroke="#071A52" stroke-width="2" stroke-linecap="round" />
    <text x="0" y="52" class="label">PROFIT SPLIT</text>
    <text x="0" y="68" class="subtext">Shared Returns</text>
  </g>

  <!-- Footer Explanation -->
  <text x="400" y="420" class="subtext">Prop firms provide access to larger capital pools by evaluating a trader's performance.</text>
  <text x="400" y="438" class="subtext">Passing evaluation requirements allows traders to keep a percentage of generated profits.</text>
</svg>
