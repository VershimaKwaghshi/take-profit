<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 700; fill: #071A52; letter-spacing: 0.1em; text-anchor: middle; }
      .label { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; fill: #071A52; letter-spacing: 0.05em; text-anchor: middle; }
      .subtext { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; font-weight: 400; fill: #64748B; text-anchor: middle; }
      .node-stroke { stroke: #071A52; stroke-width: 2; fill: #FFFFFF; }
      .line-stroke { stroke: #D9DEE8; stroke-width: 2; }
      .icon-fill { fill: #071A52; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Title / Learning Objective -->
  <text x="400" y="60" class="title">THE BRIDGE BETWEEN YOU AND THE MARKET</text>

  <!-- Horizontal Connecting Lines -->
  <line x1="220" y1="240" x2="330" y2="240" class="line-stroke" />
  <line x1="470" y1="240" x2="580" y2="240" class="line-stroke" />

  <!-- Left Node: Trader -->
  <g transform="translate(160, 240)">
    <circle cx="0" cy="0" r="42" class="node-stroke" />
    <!-- User / Individual Trader Icon -->
    <circle cx="0" cy="-10" r="10" class="icon-fill" />
    <path d="M -16 16 C -16 4, -8 2, 0 2 C 8 2, 16 4, 16 16 Z" class="icon-fill" />
    <text x="0" y="64" class="label">TRADER</text>
    <text x="0" y="82" class="subtext">Retail Participant</text>
  </g>

  <!-- Center Hub: Broker -->
  <g transform="translate(400, 240)">
    <rect x="-70" y="-45" width="140" height="90" rx="16" class="node-stroke" />
    <!-- Bridge / Intermediary Gateway Icon -->
    <path d="M -24 8 L 24 8 M -20 8 L -20 -10 L 20 -10 L 20 8 M -8 -10 L -8 8 M 8 -10 L 8 8" fill="none" stroke="#071A52" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="22" class="label">BROKER</text>
    <text x="0" y="64" class="label">INTERMEDIARY</text>
    <text x="0" y="82" class="subtext">Access &amp; Routing</text>
  </g>

  <!-- Right Node: Financial Market -->
  <g transform="translate(640, 240)">
    <circle cx="0" cy="0" r="42" class="node-stroke" />
    <!-- Global Market / Exchange Network Icon -->
    <circle cx="0" cy="0" r="18" fill="none" stroke="#071A52" stroke-width="2.5" />
    <ellipse cx="0" cy="0" rx="18" ry="7" fill="none" stroke="#071A52" stroke-width="2" />
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#071A52" stroke-width="2" />
    <text x="0" y="64" class="label">FINANCIAL MARKET</text>
    <text x="0" y="82" class="subtext">Global Exchanges</text>
  </g>

    <!-- Footer Explanation -->
  <text x="400" y="420" class="subtext">Most individual traders access financial markets through brokers.</text>
  <text x="400" y="438" class="subtext">Brokers provide the technology, accounts, and connections needed to place trades.</text>

